config:
  spec:
    destination:
      server: https://kubernetes.default.svc
    source:
      repoURL: https://github.com/Bluebit-Innovations/bitblocks-k8s-gitops-local
      targetRevision: main


applications:
  - name: blue-green
    path: charts/blue-green
    sourceHelm: false
    tool:
      helm:
        releaseName: blue-green

  # - name: nginx
  #   namespace: nginx
  #   sourceHelm: true
  #   repoURL: registry-1.docker.io/bitnamicharts
  #   targetRevision: 15.9.0
  #   tool:
  #     helm:
  #       releaseName: nginx

  - name: ingress-nginx
    project: testproject
    namespace: ingress-nginx
    chart: ingress-nginx
    sourceHelm: true
    repoURL: https://kubernetes.github.io/ingress-nginx
    targetRevision: 4.14.1
    tool:
      helm:
        releaseName: ingress-nginx
        valueFiles:
          - charts/ingress-nginx/values-nginx.yaml 
        
